<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sweet Cake Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍰 Sweet Cake Shop</h1>
        <p>Fresh & Delicious Cakes for Every Occasion</p>
    </header>

    <div class="container">
        <img id="cakeImage" src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600"
            alt="Cake">

        <h2>Chocolate Cake</h2>
        <p>Rich chocolate flavor with creamy frosting.</p>

        <button onclick="showOffer()">View Offer</button>
        <button onclick="changeCake()">Change Cake</button>

        <p id="offer"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
